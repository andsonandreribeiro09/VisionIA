<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VisionAI Ótica</title>

<!-- Ícone da aba -->
<link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/icon.jpeg') }}">

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: 'Segoe UI', sans-serif;

  /* Fundo responsivo */
  background: url("{{ url_for('static', filename='img/fundo.png') }}") no-repeat center center;
  background-size: cover;
  overflow: hidden;
  overscroll-behavior: none;
}

/* Ícone flutuante */
.float-icon {
  position: fixed;
  bottom: 5vh;
  right: 5vw;
  width: 120px;
  height: 120px;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  z-index: 1000;
  border-radius: 50%;
  touch-action: manipulation;
}

/* Imagem do ícone */
.float-icon img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s;
}

.float-icon:hover img {
  transform: scale(1.15);
}

/* Texto */
.float-text {
  position: fixed;
  bottom: 22vh;
  right: 5vw;
  font-size: 22px;
  font-weight: 600;
  color: rgb(57, 6, 179);
  text-shadow: 0 0 10px rgba(0,0,0,0.7);
  opacity: 0;
  animation: fadeInOut 2s infinite;
  pointer-events: none;
  max-width: min(320px, 78vw);
  text-align: center;
}

/* Animações */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

@keyframes fadeInOut {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

@keyframes pulseMobile {
  0% { transform: translateX(50%) scale(1); }
  50% { transform: translateX(50%) scale(1.12); }
  100% { transform: translateX(50%) scale(1); }
}

/* 📱 MOBILE (até 768px) */
@media (max-width: 768px) {
  html, body {
    height: 100svh;
    min-height: 100svh;
    background-color: #f4f1ea;
    background-size: min(100vw, 560px) auto;
    background-position: center 18px;
  }

  .float-icon {
    width: clamp(72px, 22vw, 96px);
    height: clamp(72px, 22vw, 96px);
    right: 50%;
    bottom: max(22px, calc(env(safe-area-inset-bottom) + 22px));
    animation: pulseMobile 1.5s infinite;
  }

  .float-text {
    width: min(86vw, 320px);
    right: 50%;
    bottom: max(118px, calc(env(safe-area-inset-bottom) + 118px));
    transform: translateX(50%);
    font-size: clamp(16px, 4.6vw, 22px);
    line-height: 1.2;
    color: #12343a;
    text-shadow: none;
  }
}

/* 📱 SMALL MOBILE (até 480px) */
@media (max-width: 480px) {
  .float-icon {
    width: clamp(68px, 24vw, 84px);
    height: clamp(68px, 24vw, 84px);
  }

  .float-text {
    bottom: max(108px, calc(env(safe-area-inset-bottom) + 108px));
  }
}

/* 💻 TABLET (768px a 1024px) */
@media (min-width: 769px) and (max-width: 1024px) {
  .float-icon {
    width: 100px;
    height: 100px;
  }

  .float-text {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<!-- Texto de boas-vindas piscando -->
<div class="float-text">Bem Vindo!</div>

<!-- Ícone flutuante -->
<a href="/paciente" class="float-icon">
  <img src="{{ url_for('static', filename='img/icon.jpeg') }}" alt="Ícone">
</a>

</body>
</html>
