<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionAI Admin - Login</title>
<style>
:root{
    --bg:#f4f1ea;
    --ink:#102024;
    --muted:#607074;
    --brand:#008c99;
    --border:#e5ded2;
}
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:20px;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, sans-serif;
}
.login{
    width:min(100%, 380px);
    display:grid;
    gap:16px;
    padding:24px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    box-shadow:0 18px 48px rgba(16,32,36,.12);
}
.brand{
    color:var(--brand);
    font-size:13px;
    font-weight:900;
    letter-spacing:.06em;
    text-transform:uppercase;
}
h1{margin:0;font-size:26px}
p{margin:0;color:var(--muted);line-height:1.4}
form{display:grid;gap:12px}
label{
    display:grid;
    gap:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
}
input{
    min-height:46px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:16px;
}
button{
    min-height:48px;
    border:0;
    border-radius:8px;
    background:var(--brand);
    color:#fff;
    font-weight:900;
    cursor:pointer;
}
.alert{
    padding:10px 12px;
    border-radius:8px;
    background:#fde3e8;
    color:#9f2034;
    font-weight:700;
}
</style>
</head>
<body>
<main class="login">
    <div>
        <div class="brand">VisionAI</div>
        <h1>Admin</h1>
        <p>Controle lojas, licencas e vencimentos.</p>
    </div>

    {% if erro %}
    <div class="alert">{{ erro }}</div>
    {% endif %}

    <form method="post">
        <label>
            Usuario
            <input name="usuario" autocomplete="username" required autofocus>
        </label>
        <label>
            Senha
            <input type="password" name="senha" autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
