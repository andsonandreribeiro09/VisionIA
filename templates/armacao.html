<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>VisionAI • Escolha sua Armação</title>

<link rel="stylesheet" href="{{ url_for('static', filename='visionai.css') }}">

<style>

/* fundo futurista */

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
min-height:100vh;
}

/* header */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
}

.logo{
font-size:26px;
font-weight:700;
letter-spacing:1px;
}

/* titulo */

.title{
text-align:center;
margin-top:30px;
}

.title h2{
font-size:36px;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

/* mensagem paciente */

.paciente-msg{
margin-top:15px;
font-size:20px;
color:#94a3b8;
}

.paciente-msg b{
color:#22c55e;
}

/* grid */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:40px;
padding:60px 120px;
}

/* card */

.card{
position:relative;
border-radius:20px;
padding:25px;
text-align:center;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
transition:0.4s;
cursor:pointer;
}

.card:hover{
transform:translateY(-12px) scale(1.05);
box-shadow:0 0 30px rgba(56,189,248,0.6);
}

/* imagem */

.card img{
width:180px;
margin-bottom:10px;
transition:0.3s;
}

.card:hover img{
transform:scale(1.1);
}

/* texto */

.card h3{
margin:10px 0 5px;
font-size:20px;
}

.card p{
margin:4px 0;
color:#cbd5f5;
}

/* preço */

.preco{
font-size:20px;
font-weight:700;
color:#22c55e;
margin-top:10px;
}

/* brilho animado */

.card::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.15),transparent);
transition:0.6s;
}

.card:hover::before{
left:100%;
}

</style>

</head>

<body>

<header>

<div class="logo">
VisionAI
</div>

</header>

<div class="title">

<h2>Escolha sua Armação</h2>

{% if paciente %}
<p class="paciente-msg">
Olá 🤓 <b>{{ paciente[0] }}</b>, vamos escolher sua armação
</p>
{% endif %}

</div>

<div class="grid">

{% for a in armacoes %}

<a href="/escolher_armacao/{{a[0]}}">

<div class="card">

<img src="/static/armacoes/{{a[6]}}">

<h3>{{a[1]}} {{a[2]}}</h3>

<p>Material: {{a[3]}}</p>

<p>Tamanho: {{a[4]}}</p>

<p class="preco">R$ {{a[5]}}</p>

</div>

</a>

{% endfor %}

</div>

</body>

</html>
