<!DOCTYPE html>
<html>

<head>

<title>VisionAI • Escolha sua Armação</title>

<link rel="stylesheet" href="{{ url_for('static', filename='visionai.css') }}">

<style>

/* fundo futurista */

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
min-height:100vh;
}

/* header */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
}

.logo{
font-size:26px;
font-weight:700;
letter-spacing:1px;
}

/* titulo */

.title{
text-align:center;
margin-top:30px;
}

.title h2{
font-size:36px;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

/* grid de armações */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:40px;
padding:60px 120px;
}

/* card */

.card{
position:relative;
border-radius:20px;
padding:30px;
text-align:center;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
transition:0.4s;
cursor:pointer;
}

/* efeito hover */

.card:hover{
transform:translateY(-15px) scale(1.08);
box-shadow:0 0 30px rgba(56,189,248,0.6);
}

/* imagem da armação */

.card img{
width:200px;
transition:0.4s;
}

/* zoom na imagem */

.card:hover img{
transform:scale(1.15);
}

/* brilho animado */

.card::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.2),transparent);
transition:0.6s;
}

.card:hover::before{
left:100%;
}

</style>

</head>

<body>

<header>

<div class="logo">
VisionAI
</div>

</header>

<div class="title">
<h2>Escolha sua Armação</h2>
</div>

<div class="grid">

<a href="/escolher_armacao/armacao1.png">
<div class="card">
<img src="/static/armacoes/armacao1.png">
</div>
</a>

<a href="/escolher_armacao/armacao2.png">
<div class="card">
<img src="/static/armacoes/armacao2.png">
</div>
</a>

<a href="/escolher_armacao/armacao3.png">
<div class="card">
<img src="/static/armacoes/armacao3.png">
</div>
</a>

<a href="/escolher_armacao/armacao4.png">
<div class="card">
<img src="/static/armacoes/armacao4.png">
</div>
</a>

<a href="/escolher_armacao/armacao5.png">
<div class="card">
<img src="/static/armacoes/armacao5.png">
</div>
</a>

</div>

</body>
</html>
