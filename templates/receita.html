<!DOCTYPE html>
<html>

<head>

<title>VisionAI • Receita</title>

<link rel="stylesheet" href="{{ url_for('static', filename='visionai.css') }}">

<style>

body{
margin:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
min-height:100vh;
padding-top:80px;
font-family:Segoe UI, sans-serif;
}

.container{
width:650px;
max-width:90%;
padding:40px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
margin-top:15px;
}

.grid div{
display:flex;
flex-direction:column;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
font-size:14px;
outline:none;
transition:0.2s;
}

input:focus{
box-shadow:0 0 12px #22c55e;
background:rgba(255,255,255,0.12);
}

label{
font-size:13px;
margin-bottom:5px;
color:#94a3b8;
}

.section{
margin-top:35px;
}

button{
margin-top:40px;
width:100%;
padding:15px;
border:none;
border-radius:30px;
font-size:16px;
background:linear-gradient(90deg,#06b6d4,#22c55e);
cursor:pointer;
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

header{
position:absolute;
top:20px;
left:40px;
}

.logo{
font-size:24px;
font-weight:600;
}

/* card paciente */

.paciente-card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:10px;
margin-top:20px;
}

.paciente-card p{
margin:5px 0;
font-size:14px;
}

</style>

</head>

<body>

<header>

<div class="logo">
VisionAI
</div>

</header>

<div class="container glass-card">

<h2>Receita </h2>

<!-- DADOS DO PACIENTE -->

{% if paciente %}

<div class="paciente-card">

<h3>Paciente</h3>

<p><b>Nome:</b> {{ paciente[0] }}</p>
<p><b>Idade:</b> {{ paciente[1] }}</p>
<p><b>Telefone:</b> {{ paciente[2] }}</p>
<p><b>Data do exame:</b> {{ paciente[3] }}</p>

</div>

{% endif %}

<form action="/salvar_receita" method="POST">

<!-- OD -->

<div class="section">

<h3>OD (Olho Direito)</h3>

<div class="grid">

<div>
<label>ESF</label>
<input type="text" name="od_esf" placeholder="-2.50">
</div>

<div>
<label>CIL</label>
<input type="text" name="od_cil" placeholder="-1.00">
</div>

<div>
<label>EIXO</label>
<input type="text" name="od_eixo" placeholder="90">
</div>

</div>

</div>

<!-- OE -->

<div class="section">

<h3>OE (Olho Esquerdo)</h3>

<div class="grid">

<div>
<label>ESF</label>
<input type="text" name="oe_esf" placeholder="-2.25">
</div>

<div>
<label>CIL</label>
<input type="text" name="oe_cil" placeholder="-0.75">
</div>

<div>
<label>EIXO</label>
<input type="text" name="oe_eixo" placeholder="85">
</div>

</div>

</div>

<!-- Adição -->

<div class="section">

<h3>ADIÇÃO</h3>

<input type="text" name="adicao" placeholder="+2.00" style="max-width:180px">

</div>

<button type="submit">
  💾 Salvar Receita e Ir para Medição
</button>

</form>

</div>

</body>
</html>
