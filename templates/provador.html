<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>VisionAI • Provador Virtual</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

body{
background:#050505;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
text-align:center;
}

h2{
margin-top:20px;
}

.container{
width:900px;
height:650px;
margin:auto;
margin-top:40px;
position:relative;
border-radius:20px;
overflow:hidden;
box-shadow:0 40px 100px rgba(0,0,0,0.9);
}

video{
display:none;
}

canvas{
width:100%;
height:100%;
}

.hud{
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.4);
padding:10px 20px;
border-radius:20px;
backdrop-filter:blur(10px);
color:#22c55e;
font-weight:600;
}


.botao-foto{

position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);

padding:14px 35px;
border:none;
border-radius:30px;

background:#22c55e;
color:white;
font-size:16px;

cursor:pointer;

box-shadow:0 10px 30px rgba(0,0,0,0.6);

}

.botao-foto:hover{

background:#16a34a;

}
.botao-foto:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<h2>Provador Virtual VisionAI</h2>

<div class="container">

<div class="hud">AR Tracking Active</div>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

</div>

<br>

<button class="botao-foto" onclick="capturarFoto()">
📸 Capturar Foto
</button>

<script src="{{ url_for('static', filename='visionai_ar.js') }}"></script>

<script>

function capturarFoto(){

const canvas = document.getElementById("canvas")

const imagem = canvas.toDataURL("image/png")

fetch("/salvar_foto",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
imagem:imagem
})

})
.then(r=>r.json())
.then(d=>{

alert("Foto salva!")

window.open(d.whatsapp)

})

}

</script>

</body>
</html>
