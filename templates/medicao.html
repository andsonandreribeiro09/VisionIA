<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionAI • Medição Inteligente</title>

<style>
:root {
    --bg-paper: #f4f1ea;
    --logo-blue: #00acc1;
    --text-main: #212121;
    --card-bg: #ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Segoe UI', sans-serif;
    background:var(--bg-paper);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CONTAINER */
main{
    width:100%;
    max-width:520px;
    text-align:center;
}

/* VIDEO CONTAINER (FIX CRÍTICO) */
.video-container{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3; /* 🔥 mantém proporção */
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.video-container img,
.video-container video{
    object-position: center;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit: cover; /* 🔥 CORRETO */
}

/* OVERLAY */
.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* CÍRCULO CENTRAL CORRETO */
.face-guide{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:75%;
    height:75%;
    border:2px dashed rgba(0,255,0,0.6);
    border-radius:50%;
}

/* LINHA CENTRAL */
.center-line{
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(0,255,255,0.4);
}

.instrucao-texto {
    font-size: 22px;
    font-weight: 600;
    color: #00ffcc;
    text-align: center;
    margin-top: 10px;
    letter-spacing: 0.5px;
}

/* TEXTO */
.instrucao{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 0 10px black;
}

/* PROGRESSO */
.progress{
    position:absolute;
    bottom:0;
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.2);
}

.progress-bar{
    width:0%;
    height:100%;
    background:lime;
    transition:0.2s;
}

/* STATUS estilo iPhone */
.status-pill{
    margin-top:15px;
    display:inline-block;
    padding:8px 16px;
    border-radius:20px;
    background:#000;
    color:#fff;
    font-size:13px;
    opacity:0.8;
}

/* HUD */
.hud{
    margin-top:15px;
    display:flex;
    gap:10px;
}

/* CARDS */
.card{
    flex:1;
    background:white;
    border-radius:18px;
    padding:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card span{
    font-size:11px;
    color:#666;
}

.card b{
    display:block;
    font-size:20px;
    margin-top:4px;
}

.card small{
    font-size:11px;
    color:#888;
}

/* SCORE DINÂMICO */
.score-card b{
    color:rgb(8, 156, 16);
}

/* INFO */
.info{
    margin-top:15px;
    padding:12px;
    background:var(--card-bg);
    border-radius:20px;
    font-size:14px;
}

/* BOTÃO */
.btn-finalizar{
    margin-top:20px;
    padding:16px;
    width:100%;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#00acc1,#1976d2);
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#0b1113;
    display:block;
}

.capture-shell{
    width:100vw;
    max-width:none;
    height:100svh;
    display:block;
    position:relative;
    text-align:left;
    background:#0b1113;
}

.camera-stage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    min-height:0;
    overflow:hidden;
}

.capture-shell .video-container{
    width:100%;
    height:100%;
    aspect-ratio:auto;
    border-radius:0;
    box-shadow:none;
}

.capture-shell .video-container video{
    position:absolute;
    inset:0;
    object-fit:cover;
}

.capture-shell .face-guide{
    top:48%;
    width:min(52vw, 58vh);
    height:min(62vw, 70vh);
    max-width:620px;
    max-height:720px;
    border-width:3px;
    box-shadow:0 0 0 999px rgba(0,0,0,0.18);
}

#instrucao{
    position:absolute;
    left:50%;
    bottom:28px;
    width:min(82%, 620px);
    transform:translateX(-50%);
    padding:14px 18px;
    border-radius:8px;
    background:rgba(0,0,0,0.62);
    color:white;
    font-size:clamp(16px, 2.2vw, 24px);
    font-weight:700;
    text-align:center;
    text-shadow:0 1px 6px rgba(0,0,0,0.65);
}

.capture-shell .progress{
    height:8px;
}

#progress-bar{
    width:0%;
    height:100%;
    background:#20d67b;
    transition:width 0.16s linear;
}

.metrics-panel{
    position:absolute;
    top:16px;
    right:16px;
    bottom:16px;
    z-index:3;
    width:clamp(280px, 28vw, 360px);
    height:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    background:rgba(247,245,239,0.94);
    border:1px solid rgba(255,255,255,0.36);
    border-radius:8px;
    box-shadow:0 14px 42px rgba(0,0,0,0.28);
    overflow:auto;
}

.capture-header{
    display:grid;
    gap:4px;
}

.capture-header span{
    font-size:12px;
    font-weight:700;
    color:#0097a7;
    text-transform:uppercase;
}

.capture-header h1{
    font-size:clamp(22px, 3vw, 30px);
    line-height:1.05;
    font-weight:800;
    color:#1d2528;
}

.capture-header p{
    color:#647174;
    font-size:14px;
    font-weight:600;
}

.capture-shell .status-pill{
    width:100%;
    min-height:112px;
    margin-top:0;
    padding:12px;
    display:block;
    border-radius:8px;
    font-size:13px;
    line-height:1.45;
    white-space:pre-line;
    opacity:1;
}

.capture-shell .hud{
    margin-top:0;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
}

.capture-shell .card{
    min-height:86px;
    padding:12px;
    display:grid;
    align-content:center;
    gap:4px;
    border:1px solid #e3ded5;
    border-radius:8px;
    box-shadow:0 8px 18px rgba(30,40,40,0.08);
}

.capture-shell .card span{
    font-size:12px;
    font-weight:700;
    color:#647174;
    text-transform:uppercase;
}

.capture-shell .card b{
    color:#0d1b1e;
    font-size:clamp(24px, 4vw, 34px);
    line-height:1;
}

.capture-shell .score-card b{
    color:#11804a;
}

.capture-shell .btn-finalizar{
    margin-top:auto;
    min-height:54px;
    padding:0 16px;
    border-radius:8px;
    background:#006d77;
    font-size:15px;
}

@media (max-width: 920px), (orientation: portrait){
    .camera-stage{
        height:100svh;
    }

    .metrics-panel{
        top:auto;
        left:12px;
        right:12px;
        bottom:12px;
        width:auto;
        height:auto;
        max-height:38svh;
        padding:12px;
        gap:10px;
        border:1px solid rgba(255,255,255,0.28);
        border-radius:8px;
        background:rgba(247,245,239,0.94);
        box-shadow:0 14px 42px rgba(0,0,0,0.28);
    }

    .capture-header h1{
        font-size:20px;
    }

    .capture-header p,
    .capture-header span{
        display:none;
    }

    .capture-shell .status-pill{
        min-height:0;
        font-size:12px;
        padding:9px 10px;
    }

    .capture-shell .hud{
        grid-template-columns:repeat(4, minmax(0, 1fr));
        gap:8px;
    }

    .capture-shell .card{
        min-height:68px;
        padding:8px;
    }

    .capture-shell .card span{
        font-size:10px;
    }

    .capture-shell .card b{
        font-size:22px;
    }

    .capture-shell .btn-finalizar{
        min-height:46px;
    }

    #instrucao{
        bottom:calc(38svh + 28px);
        font-size:18px;
    }
}

@media (max-width: 620px){
    .capture-shell .hud{
        grid-template-columns:repeat(2, minmax(0, 1fr));
    }

    .metrics-panel{
        max-height:48svh;
    }

    #instrucao{
        bottom:calc(48svh + 28px);
    }
}
</style>
</head>

<body data-paciente='{{ paciente_id | tojson }}'>
<script id="capture-config" type="application/json">{{ capture_config | tojson }}</script>

<main class="capture-shell">

<section class="camera-stage">

<!-- VIDEO -->
<div class="video-container">

    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">
        <div class="face-guide"></div>
        <div class="center-line"></div>

        <div id="instrucao">Posicione seu rosto</div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>
    </div>

</div>

</section>

<aside class="metrics-panel">
    <div class="capture-header">
        <span>VisionAI</span>
        <h1>Captura</h1>
        {% if paciente %}
        <p>{{ paciente["nome"] }}</p>
        {% endif %}
    </div>

<!-- STATUS -->
<div id="status" class="status-pill">
    Iniciando câmera...
</div>

<!-- HUD MODERNO -->
<div class="hud">

    <div class="card">
        <span>DP</span>
        <b id="dp">0</b>
        <small>mm</small>
    </div>

    <div class="card">
        <span>DNP E</span>
        <b id="dnp_e">0</b>
    </div>

    <div class="card">
        <span>DNP D</span>
        <b id="dnp_d">0</b>
    </div>

    <div class="card score-card">
        <span>Score</span>
        <b id="score">0</b>
        <small>%</small>
    </div>

</div>

<!-- BOTÃO -->
<button class="btn-finalizar" onclick="finalizar()">
    Finalizar medição
</button>

</aside>

</main>

<script>

// =========================
// CONFIG
// =========================
let paciente_id = JSON.parse(document.body.dataset.paciente);

const dpEl = document.getElementById("dp");
const dnp_eEl = document.getElementById("dnp_e");
const dnp_dEl = document.getElementById("dnp_d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");
const instrucaoEl = document.getElementById("instrucao");
const progressBar = document.getElementById("progress-bar");
const faceGuide = document.querySelector(".face-guide");

// CONTROLE
let capturando = false;
let tempoInicio = null;
let finalizado = false;
let enviandoLote = false;
let cameraStream = null;
let processandoFrame = false;
let medicoes = [];
const videoEl = document.getElementById("video");
const frameCanvas = document.createElement("canvas");
const frameCtx = frameCanvas.getContext("2d");
const FRAME_INTERVAL_MS = 260;
const DATA_INTERVAL_MS = 220;
const PROCESS_MAX_WIDTH = 960;
const CAPTURE_CONFIG = JSON.parse(document.getElementById("capture-config").textContent || "{}");
const CAPTURE_SCORE_MIN = Number(CAPTURE_CONFIG.score_min ?? 70);
const CAPTURE_RESET_SCORE = Number(CAPTURE_CONFIG.reset_score ?? 45);
const CAPTURE_HOLD_MS = Number(CAPTURE_CONFIG.hold_ms ?? 450);
const TOTAL_CAPTURAS = Number(CAPTURE_CONFIG.total ?? 4);
const CAPTURE_COOLDOWN_MS = Number(CAPTURE_CONFIG.cooldown_ms ?? 250);
const REQUIRE_STABLE = Boolean(CAPTURE_CONFIG.require_stable ?? false);
const STABLE_SAMPLES = Number(CAPTURE_CONFIG.stable_samples ?? 4);
const MAX_DP_SPREAD = Number(CAPTURE_CONFIG.max_dp_spread ?? 2);
const MAX_CAPTURE_GAP = Number(CAPTURE_CONFIG.max_capture_gap ?? 3);
const INCOMPATIBLE_RESET_MS = Number(CAPTURE_CONFIG.incompatible_reset_ms ?? 1800);
const GEOMETRY_SCORE_MIN = Number(CAPTURE_CONFIG.geometry_score_min ?? 0);
const CAPTURE_PHOTO_MAX_WIDTH = Number(CAPTURE_CONFIG.photo_max_width ?? 720);
const CAPTURE_PHOTO_QUALITY = Number(CAPTURE_CONFIG.photo_quality ?? 0.68);
let ultimoFrameOkEm = 0;
let ultimaCapturaEm = 0;
let leituraIncompativelInicio = null;
let falhasProcessamento = 0;
let leiturasRecentes = [];
let ultimaQualidade = {};

function numero(valor, fallback = 0){
    const convertido = Number(valor);
    return Number.isFinite(convertido) ? convertido : fallback;
}

function qualidadeDaLeitura(data){
    const campos = [
        "yaw",
        "pitch",
        "roll",
        "iris_px",
        "distancia_cm",
        "centro_face",
        "centro_face_offset",
        "score_geometrico",
        "ambiente_score",
        "brilho",
        "contraste",
        "nitidez"
    ];
    const qualidade = {};
    campos.forEach(campo => {
        if(data[campo] === null || data[campo] === undefined || data[campo] === ""){
            return;
        }
        const valor = Number(data[campo]);
        if(Number.isFinite(valor)){
            qualidade[campo] = valor;
        }
    });
    return qualidade;
}

function registrarLeitura(dp, dnpE, dnpD, score){
    if(dp <= 0 || dnpE <= 0 || dnpD <= 0 || score <= 0){
        return;
    }

    leiturasRecentes.push({ dp, dnpE, dnpD, score, em: Date.now() });
    if(leiturasRecentes.length > 12){
        leiturasRecentes.shift();
    }
}

function amplitude(lista, campo){
    const valores = lista.map(item => item[campo]);
    return Math.max(...valores) - Math.min(...valores);
}

function leituraEstavel(){
    const agora = Date.now();
    const recentes = leiturasRecentes
        .filter(item => agora - item.em < 2600)
        .slice(-STABLE_SAMPLES);

    if(recentes.length < STABLE_SAMPLES){
        return false;
    }

    return amplitude(recentes, "dp") <= MAX_DP_SPREAD
        && amplitude(recentes, "dnpE") <= MAX_DP_SPREAD
        && amplitude(recentes, "dnpD") <= MAX_DP_SPREAD;
}

function compativelComCapturas(dp){
    if(!medicoes.length){
        leituraIncompativelInicio = null;
        return true;
    }

    const mediaAtual = medicoes.reduce((total, item) => total + item.dp, 0) / medicoes.length;
    const compativel = Math.abs(dp - mediaAtual) <= MAX_CAPTURE_GAP;
    if(compativel){
        leituraIncompativelInicio = null;
    }
    return compativel;
}

async function iniciarCameraTablet(){
    try{
        const cameraPreferida = {
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 15, max: 15 }
            },
            audio: false
        };

        try{
            cameraStream = await navigator.mediaDevices.getUserMedia(cameraPreferida);
        }catch(erroCamera){
            if(erroCamera && erroCamera.name === "NotAllowedError"){
                throw erroCamera;
            }
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });
        }

        videoEl.srcObject = cameraStream;
        await new Promise(resolve => {
            if(videoEl.readyState >= 1) return resolve();
            videoEl.onloadedmetadata = resolve;
        });
        await videoEl.play();
        statusEl.innerText = "Camera iniciada";
        enviarFramesParaIA();

    }catch(e){
        console.error(e);
        statusEl.innerText = "Permita o acesso a camera e recarregue a tela";
    }
}

async function enviarFramesParaIA(){
    if(finalizado){
        return;
    }

    if(processandoFrame || videoEl.readyState < 2 || !videoEl.videoWidth || !videoEl.videoHeight){
        setTimeout(enviarFramesParaIA, FRAME_INTERVAL_MS);
        return;
    }

    processandoFrame = true;

    try{
        const fator = Math.min(PROCESS_MAX_WIDTH / videoEl.videoWidth, 1);
        frameCanvas.width = Math.round(videoEl.videoWidth * fator);
        frameCanvas.height = Math.round(videoEl.videoHeight * fator);
        frameCtx.drawImage(videoEl, 0, 0, frameCanvas.width, frameCanvas.height);

        const resp = await fetch("/process-frame", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ image: frameCanvas.toDataURL("image/jpeg", 0.72) })
        });

        if(!resp.ok){
            throw new Error(`Falha ${resp.status} ao processar frame`);
        }

        const resultado = await resp.json();
        if(resultado.status !== "ok"){
            throw new Error(resultado.msg || "Frame recusado");
        }

        ultimoFrameOkEm = Date.now();
        falhasProcessamento = 0;

    }catch(e){
        falhasProcessamento += 1;
        console.warn("Falha ao processar frame:", e);
        if(falhasProcessamento >= 4){
            instrucaoEl.innerText = "Reconectando leitura...";
        }

    }finally{
        processandoFrame = false;
        setTimeout(enviarFramesParaIA, FRAME_INTERVAL_MS);
    }
}

iniciarCameraTablet();

// =========================
// =========================
// LOOP IA (CORRIGIDO 🔥)
// =========================
let loopIA = setInterval(async () => {
    if(finalizado) return;

    try{
        const resp = await fetch(`/dados?paciente_id=${paciente_id}`);
        const data = await resp.json();

        const dp = numero(data.dp);
        const dnpE = numero(data.dnp_e);
        const dnpD = numero(data.dnp_d);
        const score = numero(data.score);
        ultimaQualidade = qualidadeDaLeitura(data);
        registrarLeitura(dp, dnpE, dnpD, score);

        dpEl.innerText = dp.toFixed(1);
        dnp_eEl.innerText = dnpE.toFixed(1);
        dnp_dEl.innerText = dnpD.toFixed(1);
        scoreEl.innerText = score.toFixed(0);

        const distanciaTexto = data.distancia_cm ? `\nDistancia: ${data.distancia_cm} cm` : "";
        const estabilidadeTexto = data.confiavel ? "Estavel" : "Estabilizando";

        // Status em tempo real
        statusEl.innerText = `
        ${data.sexo} | ${data.idade ?? "-"} anos
        Faixa: ${data.faixa}
        DP: ${dp.toFixed(1)} mm (ideal ${data.dp_min}-${data.dp_max})${distanciaTexto}
        Score: ${score.toFixed(0)}% | ${estabilidadeTexto}
        Capturas: ${medicoes.length}/${TOTAL_CAPTURAS}
        `;

        // =========================
        // 🎨 COR DINÂMICA AQUI 👇
        // =========================
        if(data.status_dp === "normal"){
            statusEl.style.background = "#0f5132"; // verde
        }
        else if(data.status_dp === "baixo"){
            statusEl.style.background = "#664d03"; // amarelo
        }
        else if(data.status_dp === "alto"){
            statusEl.style.background = "#842029"; // vermelho
        }
        else{
            statusEl.style.background = "#000";
        }
        // =========================
        // FEEDBACK VISUAL
        // =========================
        const frameRecente = Date.now() - ultimoFrameOkEm < 1600;
        const medidasValidas = dp > 0 && dnpE > 0 && dnpD > 0;
        const scoreGeometrico = numero(data.score_geometrico);
        const geometriaOk = GEOMETRY_SCORE_MIN <= 0 || scoreGeometrico >= GEOMETRY_SCORE_MIN;
        const faceOk = data.face_ok !== false;
        const distanciaOk = data.dist_ok !== false;
        const posicaoOk = data.olhos_ok !== false && data.cabeca_ok !== false && data.centro_ok !== false && faceOk && geometriaOk && distanciaOk;
        const estavel = leituraEstavel();
        const estabilidadeOk = !REQUIRE_STABLE || (data.confiavel && estavel);
        const leituraBoa = frameRecente && medidasValidas && posicaoOk && estabilidadeOk && score >= CAPTURE_SCORE_MIN;

        if(leituraBoa){
            faceGuide.style.borderColor = "lime";
            instrucaoEl.innerText = "Perfeito! Nao se mova...";
        } 
        else if(frameRecente && !faceOk){
            faceGuide.style.borderColor = "red";
            instrucaoEl.innerText = "Deixe apenas o paciente no quadro";
        }
        else if(frameRecente && !geometriaOk){
            faceGuide.style.borderColor = "yellow";
            instrucaoEl.innerText = "Centralize o rosto e endireite a cabeca";
        }
        else if(frameRecente && !distanciaOk){
            faceGuide.style.borderColor = "yellow";
            instrucaoEl.innerText = data.instrucao || "Afaste o rosto da camera";
        }
        else if(score > CAPTURE_RESET_SCORE && frameRecente){
            faceGuide.style.borderColor = "yellow";
            instrucaoEl.innerText = estavel ? (data.instrucao || "Ajuste levemente...") : "Estabilizando leitura...";
        } 
        else{
            faceGuide.style.borderColor = "red";
            instrucaoEl.innerText = frameRecente ? (data.instrucao || "Posicione melhor o rosto") : "Aguardando leitura da camera...";
        }

        // =========================
        // AUTO CAPTURA INTELIGENTE
        // =========================
        if(medicoes.length >= TOTAL_CAPTURAS){
            finalizar();
            return;
        }

        if(leituraBoa){

            // inicia contagem
            if(!capturando){
                capturando = true;
                tempoInicio = Date.now();
            }

            let tempoMs = Date.now() - tempoInicio;
            let restante = Math.max((CAPTURE_HOLD_MS - tempoMs) / 1000, 0);

            instrucaoEl.innerText = `Capturando em ${restante.toFixed(1)}s`;
            progressBar.style.width = Math.min((tempoMs / CAPTURE_HOLD_MS) * 100, 100) + "%";

            // quando completar tempo → captura
            if(tempoMs >= CAPTURE_HOLD_MS){

                if(salvarCaptura()){
                    capturando = false;
                    tempoInicio = null;
                    progressBar.style.width = "0%";

                    // Finaliza ao atingir o total configurado
                    if(medicoes.length >= TOTAL_CAPTURAS){
                        finalizar();
                    }
                } else {
                    tempoInicio = Date.now();
                    progressBar.style.width = "0%";
                }
            }

        } else if(!frameRecente || score < CAPTURE_RESET_SCORE || !medidasValidas) {
            capturando = false;
            tempoInicio = null;
            progressBar.style.width = "0%";
        }

    }catch(e){
        statusEl.innerText = `${medicoes.length}/${TOTAL_CAPTURAS} capturas concluídas`;
    }

}, DATA_INTERVAL_MS);


// =========================
// CAPTURA FOTO (AGORA RETORNA)
// =========================
function capturarFoto(){

    const video = document.getElementById("video");
    const larguraVideo = video.videoWidth || 640;
    const alturaVideo = video.videoHeight || 480;
    const fator = Math.min(CAPTURE_PHOTO_MAX_WIDTH / larguraVideo, 1);

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(larguraVideo * fator);
    canvas.height = Math.round(alturaVideo * fator);

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL("image/jpeg", CAPTURE_PHOTO_QUALITY);
}


// =========================
// SALVAR CAPTURA LOCAL
// =========================
function salvarCaptura(){
    if(finalizado || enviandoLote || medicoes.length >= TOTAL_CAPTURAS){
        return false;
    }

    const agora = Date.now();
    if(agora - ultimaCapturaEm < CAPTURE_COOLDOWN_MS){
        return false;
    }

    const dpAtual = parseFloat(dpEl.innerText);
    const dnpEAtual = parseFloat(dnp_eEl.innerText);
    const dnpDAtual = parseFloat(dnp_dEl.innerText);
    const scoreAtual = parseFloat(scoreEl.innerText);

    if(!compativelComCapturas(dpAtual)){
        if(!leituraIncompativelInicio){
            leituraIncompativelInicio = agora;
        }

        if(agora - leituraIncompativelInicio >= INCOMPATIBLE_RESET_MS){
            medicoes = [];
            leiturasRecentes = [];
            leituraIncompativelInicio = null;
            instrucaoEl.innerText = "Nova referencia capturada. Continue parado...";
        } else {
            instrucaoEl.innerText = "Leitura oscilou. Segure mais um pouco...";
            return false;
        }
    }

    const foto = capturarFoto();

    medicoes.push({
        dp: dpAtual,
        dnp_e: dnpEAtual,
        dnp_d: dnpDAtual,
        score: scoreAtual,
        qualidade: {...ultimaQualidade},
        imagem: foto
    });

    ultimaCapturaEm = agora;
    leituraIncompativelInicio = null;
    statusEl.innerText = `Captura ${Math.min(medicoes.length, TOTAL_CAPTURAS)}/${TOTAL_CAPTURAS}`;
    if(medicoes.length < TOTAL_CAPTURAS){
        leiturasRecentes = [];
        fetch("/reset_captura_engine", { method: "POST" }).catch(() => {});
    }
    return true;
}


// =========================
// FINALIZAR (ENVIA LOTE)
// =========================
function finalizar(){

    if(finalizado || enviandoLote) return;
    finalizado = true;
    enviandoLote = true;
    medicoes = medicoes.slice(0, TOTAL_CAPTURAS);

    statusEl.innerText = "📊 Validando medições...";

    fetch("/salvar_lote", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            paciente_id: paciente_id,
            medicoes: medicoes
        })
    })
    .then(res => res.json())
    .then((resp) => {

        if(resp.status !== "ok"){
            finalizado = false;
            enviandoLote = false;
            medicoes = [];
            leiturasRecentes = [];
            progressBar.style.width = "0%";
            fetch("/reset_captura_engine", { method: "POST" }).catch(() => {});
            statusEl.innerText = resp.msg || "❌ Erro ao salvar medições";
            return;
        }

        // =========================
        // 🔥 RESULTADO NA TELA
        // =========================
        const statusFinal = resp.status_validacao === "APROVADO"
            ? "✅ APROVADO"
            : (resp.status_validacao === "REVISAR" ? "⚠️ REVISAR" : "❌ REPROVADO");
        statusEl.innerText = `
ODS: ${resp.ods || "-"}
DP médio: ${resp.dp_medio}mm  
Erro: ${resp.erro_max}mm  
${statusFinal}
        `;

        // =========================
        // 🔥 PARA LOOP DA IA
        // =========================
        clearInterval(loopIA);

        try {
            // =========================
            // 🔥 DESLIGA BACKEND
            // =========================
            fetch("/stop_camera").catch(e => {
                console.warn("Erro ao parar câmera backend:", e);
            });

        } catch(e){
            console.warn("Erro ao parar câmera backend:", e);
        }

        // =========================
        // 🔥 DESLIGA STREAM FRONT
        // =========================
        if(cameraStream){
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

        if(videoEl){
            videoEl.srcObject = null;
        }

        // =========================
        // 🔥 REDIRECIONA
        // =========================
        window.location.replace("/");

    })
    .catch(err => {
        console.error(err);
        statusEl.innerText = "❌ Falha na comunicação com servidor";
        finalizado = false;
        enviandoLote = false;
    });
}
