<!DOCTYPE html>
<html>

<head>

<title>VisionAI • Medição Inteligente</title>

<link rel="stylesheet" href="{{ url_for('static', filename='visionai.css') }}">

<style>

body{
margin:0;
background:#050505;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
display:flex;
flex-direction:column;
align-items:center;
}

header{
width:100%;
padding:25px 60px;
}

.logo{
font-size:24px;
font-weight:600;
}

h2{
margin-top:10px;
font-weight:500;
}

/* container da câmera */

.camera-container{
position:relative;
margin-top:40px;
}

/* video */

.camera-container img{
width:900px;
max-width:90vw;
border-radius:20px;
box-shadow:0 30px 80px rgba(0,0,0,0.8);
}

/* overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

/* ponto pupila */

.pupil{
position:absolute;
width:14px;
height:14px;
background:#22c55e;
border-radius:50%;
box-shadow:0 0 15px #22c55e;
}

/* linha pupilar */

.line{
position:absolute;
height:2px;
background:#22c55e;
box-shadow:0 0 10px #22c55e;
}

.metrics{
margin-top:30px;
display:flex;
gap:30px;
}

.metric{
background:rgba(255,255,255,0.05);
padding:20px 30px;
border-radius:14px;
text-align:center;
}

.metric span{
font-size:26px;
font-weight:600;
}

</style>

</head>

<body>

<header>
<div class="logo">VisionAI</div>
</header>

<h2>Medição Inteligente</h2>

<div class="camera-container">

<img src="/video">

<div class="overlay">

<div class="pupil" id="pupil_left"></div>
<div class="pupil" id="pupil_right"></div>

<div class="line" id="pupil_line"></div>

</div>

</div>

<div class="metrics">

<div class="metric">
DP
<span id="dp">--</span>
</div>

<div class="metric">
Altura
<span id="altura">--</span>
</div>

</div>

</body>

</html>
