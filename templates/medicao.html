<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VisionAI • Medição Inteligente</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:radial-gradient(circle at top,#f7f8fa,#f1f2f5);
  text-align:center;
}

.video-container{
  position:relative;
  display:inline-block;
  margin-top:20px;
}

video{
  border-radius:15px;
  width:420px;
  height:320px;
  border:3px solid #22c55e;
}

canvas{
  position:absolute;
  top:0;
  left:0;
}

#foto{
  margin-top:15px;
  display:none;
  border-radius:10px;
  border:3px solid #22c55e;
  width:200px;
}

.status{
  font-size:18px;
  margin-top:10px;
  font-weight:bold;
}

.info{
  margin-top:10px;
  font-size:18px;
}

button{
  margin:20px;
  padding:12px 30px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#16a34a;
}
</style>
</head>

<body data-paciente='{{ paciente_id | tojson }}'>

<h2>👁️ Medição Inteligente</h2>

{% if paciente %}
<h3>Olá 🤓 <b>{{ paciente["nome"] }}</b></h3>
{% endif %}

<div class="video-container">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay" width="420" height="320"></canvas>
</div>

<img id="foto"/>

<div id="status" class="status">Posicione seu rosto</div>

<div class="info">
DP: <span id="dp">0</span> mm |
DNP E: <span id="dnp_e">0</span> |
DNP D: <span id="dnp_d">0</span> |
Score: <span id="score">0</span>%
</div>

<button onclick="finalizar()">Finalizar</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

// ==============================
let paciente_id = JSON.parse(document.body.dataset.paciente);

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const dpEl = document.getElementById("dp");
const dnp_eEl = document.getElementById("dnp_e");
const dnp_dEl = document.getElementById("dnp_d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");

let dp_history = [];
let stableFrames = 0;

let FOTO_TIRADA = false;
let PROCESSANDO = true;

// ==============================
navigator.mediaDevices.getUserMedia({ video:true })
.then(stream => video.srcObject = stream)
.catch(()=> statusEl.innerText = "Erro ao acessar câmera");

// ==============================
const faceMesh = new FaceMesh({
  locateFile: (file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true
});

const L = 468;
const R = 473;

let smooth = { lx:null, rx:null, ly:null, ry:null };

// ==============================
faceMesh.onResults(results=>{

  if(!PROCESSANDO) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ❌ SEM ROSTO
  if(!results.multiFaceLandmarks.length){
    statusEl.innerText = "Nenhum rosto detectado";
    stableFrames = 0;
    return;
  }

  const lm = results.multiFaceLandmarks[0];

  let lx = lm[L].x * canvas.width;
  let rx = lm[R].x * canvas.width;
  let ly = lm[L].y * canvas.height;
  let ry = lm[R].y * canvas.height;

  // ✅ CORREÇÃO SUAVIZAÇÃO
  if(smooth.lx === null){
    smooth = { lx, rx, ly, ry };
  }

  smooth.lx = smooth.lx*0.7 + lx*0.3;
  smooth.rx = smooth.rx*0.7 + rx*0.3;
  smooth.ly = smooth.ly*0.7 + ly*0.3;
  smooth.ry = smooth.ry*0.7 + ry*0.3;

  let dist = Math.hypot(
    smooth.rx - smooth.lx,
    smooth.ry - smooth.ly
  );

  // ==============================
  // ESCALA REAL
  let faceLeft = lm[234].x * canvas.width;
  let faceRight = lm[454].x * canvas.width;

  let faceWidth = Math.abs(faceRight - faceLeft);
  let escala = 140 / Math.max(faceWidth,1);

  // ==============================
  // MEDIDAS
  let dp = dist * escala;

  let cx = (smooth.lx + smooth.rx)/2;
  let cy = (smooth.ly + smooth.ry)/2;

  let nx = lm[1].x * canvas.width;
  let ny = lm[1].y * canvas.height;

  cy += (ny - cy)*0.2;

  let dnp_e = Math.abs(smooth.lx - cx) * escala;
  let dnp_d = Math.abs(smooth.rx - cx) * escala;

  // ==============================
  // HISTÓRICO + SUAVIZAÇÃO FINAL
  dp_history.push(dp);
  if(dp_history.length > 10) dp_history.shift();

  let dp_suave = dp_history.reduce((a,b)=>a+b,0) / dp_history.length;
  dp = dp_suave;

  let variacao = Math.max(...dp_history) - Math.min(...dp_history);

  // ==============================
  // SCORE
  let dp_target = 64;
  let erro = Math.abs(dp - dp_target);

  let score = 100 - (erro * 2);
  score = Math.max(0, Math.min(100, score));

  // ==============================
  // STATUS INTELIGENTE
  let status = "";

  if(dp < 55) status = "Aproxime o rosto";
  else if(dp > 75) status = "Afaste o rosto";
  else if(score < 70) status = "Centralize melhor";
  else if(score < 90) status = "Quase lá...";
  else status = "Perfeito! Não se mova";

  // ==============================
  // AUTO CAPTURA COM CONTAGEM
  if(score > 90 && variacao < 2){
    stableFrames++;
    status = "Capturando... " + stableFrames;
  } else {
    stableFrames = 0;
  }

  if(stableFrames >= 15 && !FOTO_TIRADA){
    FOTO_TIRADA = true;
    PROCESSANDO = false;
    capturarFoto();
  }

  statusEl.innerText = status;

  // ==============================
  // OVERLAY VISUAL
  ctx.strokeStyle = score > 90 ? "green" : "red";
  ctx.lineWidth = 2;
  ctx.strokeRect(50,50,320,220);

  // ==============================
  // UI
  dpEl.innerText = dp.toFixed(1);
  dnp_eEl.innerText = dnp_e.toFixed(1);
  dnp_dEl.innerText = dnp_d.toFixed(1);
  scoreEl.innerText = score.toFixed(0);

});

// ==============================
new Camera(video,{
  onFrame: async ()=> await faceMesh.send({image:video}),
  width:420,
  height:320
}).start();

// ==============================
// 📸 CAPTURA FOTO
function capturarFoto(){

  let tempCanvas = document.createElement("canvas");
  tempCanvas.width = video.videoWidth;
  tempCanvas.height = video.videoHeight;

  let tctx = tempCanvas.getContext("2d");
  tctx.drawImage(video,0,0);

  let img = tempCanvas.toDataURL("image/jpeg");

  let foto = document.getElementById("foto");
  foto.src = img;
  foto.style.display = "block";

  statusEl.innerText = "Foto capturada ✅";

  fetch("/salvar_foto",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      paciente_id,
      imagem: img
    })
  });

}

// ==============================
function finalizar(){

  if(!FOTO_TIRADA){
    alert("Aguarde a captura da foto!");
    return;
  }

  fetch("/salvar_medicao",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      paciente_id,
      dp: parseFloat(dpEl.innerText),
      dnp_e: parseFloat(dnp_eEl.innerText),
      dnp_d: parseFloat(dnp_dEl.innerText),
      score: parseFloat(scoreEl.innerText)
    })
  })
  .then(()=> window.location.href="/prontuario/"+paciente_id);

}

</script>

</body>
</html>
