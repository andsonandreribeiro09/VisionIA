<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionAI • Medição Inteligente</title>

<style>
:root {
    --bg-paper: #f4f1ea;
    --logo-blue: #00acc1;
    --text-main: #212121;
    --card-bg: #ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Segoe UI', sans-serif;
    background:var(--bg-paper);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CONTAINER */
main{
    width:100%;
    max-width:520px;
    text-align:center;
}

/* VIDEO CONTAINER (FIX CRÍTICO) */
.video-container{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3; /* 🔥 mantém proporção */
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.video-container img,
.video-container video{
    object-position: center;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit: cover; /* 🔥 CORRETO */
}

/* OVERLAY */
.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* CÍRCULO CENTRAL CORRETO */
.face-guide{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:75%;
    height:75%;
    border:2px dashed rgba(0,255,0,0.6);
    border-radius:50%;
}

/* LINHA CENTRAL */
.center-line{
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(0,255,255,0.4);
}

.instrucao-texto {
    font-size: 22px;
    font-weight: 600;
    color: #00ffcc;
    text-align: center;
    margin-top: 10px;
    letter-spacing: 0.5px;
}

/* TEXTO */
.instrucao{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 0 10px black;
}

/* PROGRESSO */
.progress{
    position:absolute;
    bottom:0;
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.2);
}

.progress-bar{
    width:0%;
    height:100%;
    background:lime;
    transition:0.2s;
}

/* STATUS estilo iPhone */
.status-pill{
    margin-top:15px;
    display:inline-block;
    padding:8px 16px;
    border-radius:20px;
    background:#000;
    color:#fff;
    font-size:13px;
    opacity:0.8;
}

/* HUD */
.hud{
    margin-top:15px;
    display:flex;
    gap:10px;
}

/* CARDS */
.card{
    flex:1;
    background:white;
    border-radius:18px;
    padding:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card span{
    font-size:11px;
    color:#666;
}

.card b{
    display:block;
    font-size:20px;
    margin-top:4px;
}

.card small{
    font-size:11px;
    color:#888;
}

/* SCORE DINÂMICO */
.score-card b{
    color:rgb(8, 156, 16);
}

/* INFO */
.info{
    margin-top:15px;
    padding:12px;
    background:var(--card-bg);
    border-radius:20px;
    font-size:14px;
}

/* BOTÃO */
.btn-finalizar{
    margin-top:20px;
    padding:16px;
    width:100%;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#00acc1,#1976d2);
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}
</style>
</head>

<body data-paciente='{{ paciente_id | tojson }}'>

<main>

{% if paciente %}
<h3>Olá 🤓 <b>{{ paciente["nome"] }}</b></h3>
{% endif %}

<!-- VIDEO -->
<div class="video-container">

    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">
        <div class="face-guide"></div>
        <div class="center-line"></div>

        <div id="instrucao">Posicione seu rosto</div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>
    </div>

</div>

<!-- STATUS -->
<div id="status" class="status-pill">
    Iniciando câmera...
</div>

<!-- HUD MODERNO -->
<div class="hud">

    <div class="card">
        <span>DP</span>
        <b id="dp">0</b>
        <small>mm</small>
    </div>

    <div class="card">
        <span>DNP E</span>
        <b id="dnp_e">0</b>
    </div>

    <div class="card">
        <span>DNP D</span>
        <b id="dnp_d">0</b>
    </div>

    <div class="card score-card">
        <span>Score</span>
        <b id="score">0</b>
        <small>%</small>
    </div>

</div>

<!-- BOTÃO -->
<button class="btn-finalizar" onclick="finalizar()">
    Finalizar medição
</button>

</main>

<script>

// =========================
// CONFIG
// =========================
let paciente_id = JSON.parse(document.body.dataset.paciente);

const dpEl = document.getElementById("dp");
const dnp_eEl = document.getElementById("dnp_e");
const dnp_dEl = document.getElementById("dnp_d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");
const instrucaoEl = document.getElementById("instrucao");
const progressBar = document.getElementById("progress-bar");
const faceGuide = document.querySelector(".face-guide");

// CONTROLE
let capturando = false;
let tempoInicio = null;
let finalizado = false;
let cameraStream = null;
let processandoFrame = false;
const videoEl = document.getElementById("video");
const frameCanvas = document.createElement("canvas");
const frameCtx = frameCanvas.getContext("2d");
const FRAME_INTERVAL_MS = 280;
const DATA_INTERVAL_MS = 300;
const CAPTURE_SCORE_MIN = 85;
const CAPTURE_RESET_SCORE = 75;
const CAPTURE_HOLD_MS = 1800;

async function iniciarCameraTablet(){
    try{
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 15, max: 15 }
            },
            audio: false
        });

        videoEl.srcObject = cameraStream;
        statusEl.innerText = "Camera iniciada";
        enviarFramesParaIA();

    }catch(e){
        console.error(e);
        statusEl.innerText = "Permita o acesso a camera para medir";
    }
}

async function enviarFramesParaIA(){
    if(finalizado || processandoFrame || videoEl.readyState < 2){
        setTimeout(enviarFramesParaIA, FRAME_INTERVAL_MS);
        return;
    }

    processandoFrame = true;

    try{
        frameCanvas.width = videoEl.videoWidth || 640;
        frameCanvas.height = videoEl.videoHeight || 480;
        frameCtx.drawImage(videoEl, 0, 0, frameCanvas.width, frameCanvas.height);

        await fetch("/process-frame", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ image: frameCanvas.toDataURL("image/jpeg", 0.8) })
        });

    }catch(e){
        console.warn("Falha ao processar frame:", e);

    }finally{
        processandoFrame = false;
        setTimeout(enviarFramesParaIA, FRAME_INTERVAL_MS);
    }
}

iniciarCameraTablet();

// =========================
// =========================
// LOOP IA (CORRIGIDO 🔥)
// =========================
let loopIA = setInterval(async () => {
    if(finalizado) return;

    try{
        const resp = await fetch(`/dados?paciente_id=${paciente_id}`);
        const data = await resp.json();

        dpEl.innerText = data.dp.toFixed(1);
        dnp_eEl.innerText = data.dnp_e.toFixed(1);
        dnp_dEl.innerText = data.dnp_d.toFixed(1);
        scoreEl.innerText = data.score.toFixed(0);

        const score = data.score;

        const distanciaTexto = data.distancia_cm ? `\nDistancia: ${data.distancia_cm} cm` : "";
        const estabilidadeTexto = data.confiavel ? "Estavel" : "Estabilizando";

        // Status em tempo real
        statusEl.innerText = `
        ${data.sexo} | ${data.idade ?? "-"} anos
        Faixa: ${data.faixa}
        DP: ${data.dp.toFixed(1)} mm (ideal ${data.dp_min}-${data.dp_max})${distanciaTexto}
        Score: ${score}% | ${estabilidadeTexto}
        Capturas: ${medicoes.length}/6
        `;

        // =========================
        // 🎨 COR DINÂMICA AQUI 👇
        // =========================
        if(data.status_dp === "normal"){
            statusEl.style.background = "#0f5132"; // verde
        }
        else if(data.status_dp === "baixo"){
            statusEl.style.background = "#664d03"; // amarelo
        }
        else if(data.status_dp === "alto"){
            statusEl.style.background = "#842029"; // vermelho
        }
        else{
            statusEl.style.background = "#000";
        }

        // =========================
        // FEEDBACK VISUAL
        // =========================
        if(data.confiavel && score >= CAPTURE_SCORE_MIN){
            faceGuide.style.borderColor = "lime";
            instrucaoEl.innerText = "Perfeito! Nao se mova...";
        } 
        else if(score > CAPTURE_RESET_SCORE){
            faceGuide.style.borderColor = "yellow";
            instrucaoEl.innerText = data.instrucao || "Ajuste levemente...";
        } 
        else{
            faceGuide.style.borderColor = "red";
            instrucaoEl.innerText = data.instrucao || "Posicione melhor o rosto";
        }

        // =========================
        // AUTO CAPTURA INTELIGENTE
        // =========================
        if(data.confiavel && score >= CAPTURE_SCORE_MIN){

            // inicia contagem
            if(!capturando){
                capturando = true;
                tempoInicio = Date.now();
            }

            let tempoMs = Date.now() - tempoInicio;
            let restante = Math.max((CAPTURE_HOLD_MS - tempoMs) / 1000, 0);

            instrucaoEl.innerText = `Capturando em ${restante.toFixed(1)}s`;
            progressBar.style.width = Math.min((tempoMs / CAPTURE_HOLD_MS) * 100, 100) + "%";

            // quando completar tempo → captura
            if(tempoMs >= CAPTURE_HOLD_MS){

                salvarCaptura(); // 🔥 SALVA LOCAL

                capturando = false;
                tempoInicio = null;
                progressBar.style.width = "0%";

                // 🔥 SE JÁ TEM 6 → FINALIZA
                if(medicoes.length >= 6){
                    finalizar();
                }
            }

        } else if(score < CAPTURE_RESET_SCORE || !data.confiavel) {
            capturando = false;
            tempoInicio = null;
            progressBar.style.width = "0%";
        }

    }catch(e){
        statusEl.innerText = `📸 ${medicoes.length}/6 capturas concluídas`;
    }

}, DATA_INTERVAL_MS);


// =========================
// CONFIG NOVA
// =========================
let medicoes = [];
const TOTAL_CAPTURAS = 6;


// =========================
// CAPTURA FOTO (AGORA RETORNA)
// =========================
function capturarFoto(){

    const video = document.getElementById("video");

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL("image/jpeg");
}


// =========================
// SALVAR CAPTURA LOCAL
// =========================
function salvarCaptura(){

    const foto = capturarFoto();

    medicoes.push({
        dp: parseFloat(dpEl.innerText),
        dnp_e: parseFloat(dnp_eEl.innerText),
        dnp_d: parseFloat(dnp_dEl.innerText),
        score: parseFloat(scoreEl.innerText),
        imagem: foto
    });

    statusEl.innerText = `📸 Captura ${medicoes.length}/${TOTAL_CAPTURAS}`;
}


// =========================
// FINALIZAR (ENVIA LOTE)
// =========================
function finalizar(){

    if(finalizado) return;
    finalizado = true;

    statusEl.innerText = "📊 Validando medições...";

    fetch("/salvar_lote", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            paciente_id: paciente_id,
            medicoes: medicoes
        })
    })
    .then(res => res.json())
    .then(async (resp) => {

        if(resp.status !== "ok"){
            finalizado = false;
            statusEl.innerText = "❌ Erro ao salvar medições";
            return;
        }

        // =========================
        // 🔥 RESULTADO NA TELA
        // =========================
        statusEl.innerText = `
DP médio: ${resp.dp_medio}mm  
Erro: ${resp.erro_max}mm  
${resp.status_validacao === "APROVADO" ? "✅ APROVADO" : "❌ REPROVADO"}
        `;

        // =========================
        // 🔥 PARA LOOP DA IA
        // =========================
        clearInterval(loopIA);

        try {
            // =========================
            // 🔥 DESLIGA BACKEND
            // =========================
            await fetch("/stop_camera");

        } catch(e){
            console.warn("Erro ao parar câmera backend:", e);
        }

        // =========================
        // 🔥 DESLIGA STREAM FRONT
        // =========================
        if(cameraStream){
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

        if(videoEl){
            videoEl.srcObject = null;
        }

        // =========================
        // 🔥 REDIRECIONA
        // =========================
        setTimeout(() => {
            window.location.href = "/paciente";
        }, 1500);

    })
    .catch(err => {
        console.error(err);
        statusEl.innerText = "❌ Falha na comunicação com servidor";
        finalizado = false;
    });
}

</script>
</body>
</html>
