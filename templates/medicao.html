<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionAI • Medição Inteligente</title>

<style>

:root{
    --bg-paper:#f4f1ea;
    --card-bg:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:var(--bg-paper);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

main{
    width:100%;
    max-width:520px;
    text-align:center;
}

.video-container{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    border-radius:20px;
    overflow:hidden;
    background:black;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

.overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.face-guide{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:75%;
    height:75%;
    border:2px dashed red;
    border-radius:50%;
    transition:.2s;
}

.center-line{
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(0,255,255,0.5);
}

.instrucao{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 0 10px black;
}

.progress{
    position:absolute;
    bottom:0;
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.2);
}

.progress-bar{
    width:0%;
    height:100%;
    background:lime;
    transition:.2s;
}

.status-pill{
    margin-top:15px;
    display:inline-block;
    padding:10px 18px;
    border-radius:20px;
    background:black;
    color:white;
    font-size:13px;
    white-space:pre-line;
}

.hud{
    margin-top:15px;
    display:flex;
    gap:10px;
}

.card{
    flex:1;
    background:white;
    border-radius:18px;
    padding:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card span{
    font-size:11px;
    color:#666;
}

.card b{
    display:block;
    font-size:20px;
    margin-top:4px;
}

.card small{
    font-size:11px;
    color:#888;
}

.score-card b{
    color:green;
}

.btn-finalizar{
    margin-top:20px;
    padding:16px;
    width:100%;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#00acc1,#1976d2);
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

</style>
</head>

<body data-paciente='{{ paciente_id | tojson }}'>

<main>

{% if paciente %}
<h3>Olá 🤓 <b>{{ paciente["nome"] }}</b></h3>
{% endif %}

<!-- CAMERA -->
<div class="video-container">

    <video
        id="video"
        autoplay
        playsinline
        muted
    ></video>

    <div class="overlay">

        <div class="face-guide"></div>

        <div class="center-line"></div>

        <div class="instrucao" id="instrucao">
            Posicione seu rosto
        </div>

        <div class="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

    </div>

</div>

<!-- STATUS -->
<div id="status" class="status-pill">
    Inicializando câmera...
</div>

<!-- HUD -->
<div class="hud">

    <div class="card">
        <span>DP</span>
        <b id="dp">0</b>
        <small>mm</small>
    </div>

    <div class="card">
        <span>DNP E</span>
        <b id="dnp_e">0</b>
    </div>

    <div class="card">
        <span>DNP D</span>
        <b id="dnp_d">0</b>
    </div>

    <div class="card score-card">
        <span>Score</span>
        <b id="score">0</b>
        <small>%</small>
    </div>

</div>

<button class="btn-finalizar" onclick="finalizar()">
    Finalizar medição
</button>

</main>

<script>

// =========================
// ELEMENTOS
// =========================
const video = document.getElementById("video");

const dpEl = document.getElementById("dp");
const dnp_eEl = document.getElementById("dnp_e");
const dnp_dEl = document.getElementById("dnp_d");
const scoreEl = document.getElementById("score");

const statusEl = document.getElementById("status");
const instrucaoEl = document.getElementById("instrucao");
const progressBar = document.getElementById("progress-bar");
const faceGuide = document.querySelector(".face-guide");

// =========================
// CONFIG
// =========================
let capturando = false;
let tempoInicio = null;
let finalizado = false;

let medicoes = [];
const TOTAL_CAPTURAS = 6;

let paciente_id = JSON.parse(document.body.dataset.paciente);

// =========================
// ABRIR CÂMERA
// =========================
async function iniciarCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{ideal:1280},
                height:{ideal:720}
            },

            audio:false

        });

        video.srcObject = stream;

        await video.play();

        statusEl.innerText = "✅ Câmera iniciada";

    }catch(err){

        console.error(err);

        statusEl.innerText = "❌ Permissão negada";

    }
}

iniciarCamera();

// =========================
// CAPTURA FRAME
// =========================
function capturarFoto(){

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    // espelhamento
    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);

    ctx.drawImage(video,0,0);

    return canvas.toDataURL("image/jpeg",0.9);
}

// =========================
// LOOP IA
// =========================
let loopIA = setInterval(async ()=>{

    if(finalizado) return;

    try{

        const imagem = capturarFoto();

        const resp = await fetch("/processar_frame",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                imagem:imagem,
                paciente_id:paciente_id
            })

        });

        const data = await resp.json();

        // =========================
        // HUD
        // =========================
        dpEl.innerText = Number(data.dp).toFixed(1);
        dnp_eEl.innerText = Number(data.dnp_e).toFixed(1);
        dnp_dEl.innerText = Number(data.dnp_d).toFixed(1);
        scoreEl.innerText = Number(data.score).toFixed(0);

        const score = data.score || 0;

        // =========================
        // STATUS
        // =========================
        statusEl.innerText =
`👤 ${data.sexo || "-"} | ${data.idade || "-"} anos
📊 ${data.faixa || "-"}
📏 DP: ${Number(data.dp).toFixed(1)} mm
🎯 Score: ${score}%
📸 ${medicoes.length}/${TOTAL_CAPTURAS}`;

        // =========================
        // COR STATUS
        // =========================
        if(data.status_dp === "normal"){
            statusEl.style.background = "#0f5132";
        }
        else if(data.status_dp === "baixo"){
            statusEl.style.background = "#664d03";
        }
        else if(data.status_dp === "alto"){
            statusEl.style.background = "#842029";
        }
        else{
            statusEl.style.background = "#000";
        }

        // =========================
        // GUIA VISUAL
        // =========================
        if(score > 95){

            faceGuide.style.borderColor = "lime";
            instrucaoEl.innerText = "✅ Perfeito";

        }
        else if(score > 75){

            faceGuide.style.borderColor = "yellow";
            instrucaoEl.innerText = "⚠️ Ajuste levemente";

        }
        else{

            faceGuide.style.borderColor = "red";
            instrucaoEl.innerText = "❌ Posicione o rosto";

        }

        // =========================
        // AUTO CAPTURA
        // =========================
        if(score >= 85){

            if(!capturando){

                capturando = true;
                tempoInicio = Date.now();

            }

            let tempo = (Date.now() - tempoInicio)/1000;

            progressBar.style.width =
                Math.min((tempo/2)*100,100) + "%";

            instrucaoEl.innerText =
                `📸 Capturando em ${(2-tempo).toFixed(1)}s`;

            if(score < 95){

                capturando = false;
                tempoInicio = null;
                progressBar.style.width = "0%";

                return;
            }

            if(tempo >= 2){

                salvarCaptura();

                capturando = false;
                tempoInicio = null;

                progressBar.style.width = "0%";

                if(medicoes.length >= TOTAL_CAPTURAS){

                    finalizar();

                }

            }

        }else{

            capturando = false;
            tempoInicio = null;
            progressBar.style.width = "0%";

        }

    }catch(err){

        console.error(err);

        statusEl.innerText = "❌ Erro comunicação IA";

    }

},250);

// =========================
// SALVAR CAPTURA
// =========================
function salvarCaptura(){

    medicoes.push({

        dp:parseFloat(dpEl.innerText),
        dnp_e:parseFloat(dnp_eEl.innerText),
        dnp_d:parseFloat(dnp_dEl.innerText),
        score:parseFloat(scoreEl.innerText),
        imagem:capturarFoto()

    });

    statusEl.innerText =
        `📸 Captura ${medicoes.length}/${TOTAL_CAPTURAS}`;
}

// =========================
// FINALIZAR
// =========================
async function finalizar(){

    if(finalizado) return;

    finalizado = true;

    statusEl.innerText = "📊 Validando...";

    try{

        const resp = await fetch("/salvar_lote",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                paciente_id:paciente_id,
                medicoes:medicoes

            })

        });

        const data = await resp.json();

        if(data.status !== "ok"){

            statusEl.innerText = "❌ Erro ao salvar";
            finalizado = false;

            return;
        }

        statusEl.innerText =
`DP médio: ${data.dp_medio}mm
Erro: ${data.erro_max}mm
${data.status_validacao}`;

        clearInterval(loopIA);

        // desligar câmera
        const tracks = video.srcObject?.getTracks();

        if(tracks){

            tracks.forEach(track => track.stop());

        }

        setTimeout(()=>{

            window.location.href = "/paciente";

        },1500);

    }catch(err){

        console.error(err);

        statusEl.innerText = "❌ Falha servidor";

        finalizado = false;

    }
}

</script>

</body>
</html>
