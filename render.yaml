services:
  - type: web
    name: visionai
    runtime: docker
    disk:
      name: visionai-data
      mountPath: /var/data
      sizeGB: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: VISIONAI_DATA_DIR
        value: /var/data
      - key: VISIONAI_DB_PATH
        value: /var/data/visionai.db
      - key: VISIONAI_REQUIRE_DATABASE_URL
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: Banco_dados_Vision_IA
          property: connectionString
