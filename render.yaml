services:
  - type: web
    name: visionai-medicao
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    disk:
      name: visionai-medicao-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: VISIONAI_APP
        value: medicao
      - key: VISIONAI_DATA_DIR
        value: /var/data
      - key: VISIONAI_DB_PATH
        value: /var/data/visionai.db
      - key: VISIONAI_REQUIRE_DATABASE_URL
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: Banco_dados_Vision_IA
          property: connectionString

  - type: web
    name: visionai-laboratorio
    runtime: docker
    dockerfilePath: ./Dockerfile.laboratorio
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: VISIONAI_APP
        value: laboratorio
      - key: VISIONAI_REQUIRE_DATABASE_URL
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: Banco_dados_Vision_IA
          property: connectionString
